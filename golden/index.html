rder-top:1px solid var(--gold);padding-top:19px}.step-number{display:block;font:700 56px/1 var(--display);color:var(--gold-light);margin-bottom:20px}.step p{font-size:18px;max-width:315px}.step .pending{margin-top:12px}.benefits{display:grid;gap:26px}.benefit{padding:26px 0;border-top:1px solid var(--line)}.icon-disc{width:56px;height:56px;display:grid;place-items:center;border-radius:50%;background:var(--green);color:var(--cream);margin-bottom:22px}.icon-disc svg{width:30px;height:30px}.benefit h3{font-size:25px;line-height:1.15;margin-bottom:12px}.benefit p{font-size:16px;color:var(--muted)}.reveal.is-hidden{opacity:0;transform:translateY(12px)}.reveal{transition:opacity .5s,transform .5s;transition-delay:var(--delay,0ms)}.guarantee-inner{display:grid;gap:36px}.guarantee-icon{width:78px;height:78px;color:var(--gold-light)}.guarantee h2{max-width:1040px;font-size:clamp(2.9rem,5.4vw,5.2rem)}.guarantee p:last-child{color:var(--gold-light);margin-top:30px}.pricing .section-heading{text-align:center;margin:0 auto 40px}.price-card{max-width:590px;margin:auto;padding:32px 24px;background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--gold);text-align:center}.price-number{font:700 clamp(5rem,10vw,7rem)/1 var(--display);letter-spacing:-.04em;color:var(--gold-text)}.per-box{color:var(--muted);font-size:14px;margin-top:10px}.checklist{padding:25px 0;margin:25px 0;list-style:none;text-align:left;border-block:1px solid var(--line)}.checklist li{display:flex;gap:12px;align-items:flex-start;padding:6px 0}.checklist svg{width:20px;height:24px;flex-shrink:0}.price-card .wa-block{width:100%;align-items:center}.price-card .btn{width:100%}.zone{max-width:590px;text-align:center;margin:20px auto 0;font:12px/1.7 var(--mono)}.faq-layout{display:grid;gap:30px}.faq-layout .section-heading{margin:0}.faq-list{min-width:0}details{border-top:1px solid var(--line)}details:last-child{border-bottom:1px solid var(--line)}summary{list-style:none;cursor:pointer;display:flex;gap:18px;align-items:center;justify-content:space-between;min-height:72px;padding:20px 0;font-weight:650;line-height:1.45}summary::-webkit-details-marker{display:none}summary:after{content:'+';font-size:24px;color:var(--gold-text);font-weight:400}details[open] summary:after{content:'−'}details>p{padding:0 30px 23px 0;color:var(--muted)}.contact-inner{display:grid;gap:35px;align-items:center}.contact h2{max-width:740px}.contact-actions{display:flex;align-items:center;gap:32px;flex-wrap:wrap;margin-top:30px}.qr-group{text-align:center;max-width:240px}.qr-slot{width:160px;height:160px;border:1px dashed var(--gold);display:grid;place-items:center;margin:0 auto 12px;position:relative}.qr-slot img{position:absolute;width:144px;height:144px;inset:7px}.qr-slot strong{font:700 36px/1 var(--display);color:var(--gold-light)}.qr-group>p{font-size:14px;margin-top:12px}.contact-meta{border-top:1px solid var(--gold);padding-top:20px;margin-top:32px;font-size:14px}.footer{padding:38px 0 24px;border-top:1px solid var(--line)}.footer-inner{display:flex;justify-content:space-between;align-items:center;gap:28px;flex-wrap:wrap}.badges{display:grid;grid-template-columns:1fr 1fr;gap:17px 25px}.badge{display:flex;align-items:center;gap:8px;font-size:12px}.badge svg{width:21px;height:21px}.footer-social{font-size:12px;line-height:2}.footer-social .pending{font-size:11px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

<body><div id="app"></div>
<script>
const COPY = {
  title: 'Golden Hass | Tu cajita de la semana',
  description: '8 aguacates Hass premium, seleccionados uno a uno por su calidad y frescura.',
  brand: {name:'Golden Hass',golden:'GOLDEN',hass:'HASS'},
  pending:'[PENDIENTE: confirmar con Golden Hass]',
  whatsapp:{number:'',prefix:'57',placeholder:'[PENDIENTE]',button:'Pedir por WhatsApp',message:'Hola Golden Hass, quiero mi cajita de la semana'},
  nav:['Qué trae','Cómo funciona','Precio','Preguntas'],
  hero:{kicker:'ENTREGA A DOMICILIO',title:['Tu cajita','de la semana'],lead:'8 aguacates Hass premium, seleccionados uno a uno por su calidad y frescura.',solo:'Solo',price:'$15.000',more:'Ver qué trae ↓',alt:'Ilustración de una caja kraft abierta con ocho aguacates Hass: cuatro pintones y cuatro verdes.'},
  box:{kicker:'QUÉ TRAE',title:'8 aguacates Hass, 4 + 4',panels:[['4 pintones','Listos para consumir en los próximos días.'],['4 verdes','Para que maduren durante la semana.']],caption:'Hoy tienes {n} listos',day:'Día {n}',first:'Día 1',last:'Día 7',label:'4 pintones + 4 verdes'},
  how:{kicker:'CÓMO FUNCIONA',title:'Tres pasos y llega a tu puerta',numbers:['01','02','03'],steps:['Escribe por WhatsApp o escanea el QR.','Agenda tu entrega. Entregamos todos los lunes.','La cajita llega hasta la puerta de tu apartamento, sin salir de casa.']},
  why:{kicker:'POR QUÉ GOLDEN HASS',title:'Lo que va en cada cajita',cards:[['8 aguacates Hass.','Seleccionados uno a uno por su calidad y frescura.'],['4 pintones + 4 verdes.','Perfectos para disfrutar hoy y durante toda la semana.'],['Entrega a domicilio.','Hasta la puerta de tu apartamento, sin salir de casa.'],['Garantía de calidad.','Si algún aguacate no está en buen estado, lo cambiamos.'],['Pide fácil.','Haz tu pedido rápido y seguro por WhatsApp.']]},
  guarantee:{kicker:'GARANTÍA',title:'Si algún aguacate no está en buen estado, lo cambiamos.',line:'Escríbenos por WhatsApp y lo resolvemos.'},
  price:{kicker:'PRECIO',title:'Una cajita, un precio',amount:'$15.000',unit:'por cajita',items:['8 aguacates Hass premium','4 pintones + 4 verdes','Entrega hasta tu puerta','Garantía de calidad'],zone:'Zona de entrega:'},
  faq:{kicker:'PREGUNTAS',title:'Antes de pedir',items:[['¿Qué trae la cajita?','8 aguacates Hass premium: 4 pintones listos para los próximos días y 4 verdes que maduran durante la semana.'],['¿Cómo pido?','Por WhatsApp. Escribes, agendas tu entrega y la cajita llega a tu puerta el lunes.'],['¿Qué pasa si un aguacate llega en mal estado?','Lo cambiamos. Es nuestra garantía de calidad.'],['¿Qué días entregan?','Todos los lunes.'],['¿A qué zonas entregan?',null],['¿Cómo pago?',null]]},
  contact:{title:'¿Pedimos tu cajita de esta semana?',qr:'QR',line:'Escanea el QR y agenda tu pedido por WhatsApp.',city:'Ciudad:'},
  footer:{badges:['Fresco','Saludable','Natural','Hecho para ti'],instagram:'Instagram',copyright:'© Golden Hass 2026.'},
  assets:{logo:'assets/logo.svg',box:'assets/box.svg',qr:'assets/qr.png',qrReady:false},
  symbols:{combo:'4+4'}
};
// All editable Spanish text, metadata and accessibility strings live in COPY.
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svg = (body, cls='') => `<svg class="${cls}" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
const icons={
  wa:svg('<path d="M27 15a11 11 0 0 1-16.5 9.5L4 27l2-7A11 11 0 1 1 27 15Z"/><path d="M12 9l-2 2c-1 5 6 12 11 10l2-2-4-3-2 2c-2-1-3-2-4-4l2-2Z"/>'),
  avocado:svg('<path d="M16 3c-5 0-4 5-8 11-6 9 0 15 8 15s14-6 8-15c-4-6-3-11-8-11Z"/><circle cx="16" cy="20" r="5"/>'),
  combo:svg(`<text x="16" y="21" text-anchor="middle" fill="currentColor" stroke="none" font-size="15" font-weight="700">${COPY.symbols.combo}</text>`),
  truck:svg('<path d="M3 8h16v14H3ZM19 13h6l4 5v4H19"/><circle cx="9" cy="24" r="3"/><circle cx="24" cy="24" r="3"/><path d="M1 12h8M1 16h6"/>'),
  shield:svg('<path d="M16 3l12 4v9c0 6-6 10-12 13C10 26 4 22 4 16V7Z"/><path d="M10 15l4 4 8-8"/>'),
  check:svg('<path d="M7 16l6 6L26 9"/>'),
  leaf:svg('<path d="M5 26C3 9 14 3 28 4c0 15-8 24-23 22ZM5 26L23 9"/>'),
  heart:svg('<path d="M16 27S1 17 4 9c2-6 10-5 12 0 2-5 10-6 12 0 3 8-12 18-12 18Z"/>'),
  person:svg('<circle cx="16" cy="9" r="5"/><path d="M6 28v-4a10 10 0 0 1 20 0v4"/>')
};
const mark = `<svg viewBox="0 0 100 124" aria-hidden="true"><!-- improvised from the flyer, replace with client vector --><path d="M26 23L18 5L34 14L40 2L50 13L60 2L66 14L82 5L74 23Z" fill="var(--gold)"/><path d="M50 32C31 32 34 48 24 64C4 96 25 118 50 118C75 118 96 96 76 64C66 48 69 32 50 32Z" fill="none" stroke="var(--green-deep)" stroke-width="6"/><circle cx="50" cy="88" r="17" fill="var(--gold)"/><path d="M46 75C34 79 34 93 43 100" fill="none" stroke="var(--cream)" stroke-width="3"/></svg>`;
const leaf = `<path d="M7 77C5 31 31 5 90 7C86 48 61 79 7 77Z" fill="var(--green)"/><path d="M3 85L73 24M25 63L24 40M44 45L65 45" fill="none" stroke="var(--gold)" stroke-width="1.5"/>`;
const pending = (text=COPY.pending) => `<span class="pending">${esc(text)}</span>`;
const waUrl = `https://wa.me/${COPY.whatsapp.prefix}${COPY.whatsapp.number || COPY.whatsapp.placeholder}?text=${encodeURIComponent(COPY.whatsapp.message)}`;
const wa = () => `<div class="wa-block"><a class="btn whatsapp" href="${esc(waUrl)}" ${COPY.whatsapp.number ? '' : `title="${esc(COPY.pending)}"`} target="_blank" rel="noopener noreferrer">${icons.wa}${esc(COPY.whatsapp.button)}</a>${COPY.whatsapp.number ? '' : pending()}</div>`;
const heading = (kicker,title,id) => `<div class="section-heading"><p class="kicker">${esc(kicker)}</p><h2 id="${id}">${esc(title)}</h2></div>`;
const fruit = (ripe=false) => `<svg viewBox="0 0 100 120" aria-hidden="true"><path d="M50 10C32 10 31 31 25 42C18 54 9 65 12 81C15 100 31 110 50 110C69 110 85 100 88 81C91 65 82 54 75 42C69 31 68 10 50 10Z" fill="${ripe?'var(--ripe)':'var(--green)'}" stroke="var(--green-deep)" stroke-width="3"/><path d="M40 21C26 35 32 43 22 62" fill="none" stroke="var(--leaf)" stroke-width="5" stroke-linecap="round" opacity=".65"/><path d="M49 10L52 4" stroke="var(--kraft)" stroke-width="4" stroke-linecap="round"/></svg>`;
document.title=COPY.title;
document.querySelector('meta[name="description"]').content=COPY.description;
document.getElementById('app').innerHTML=`
<nav class="nav" aria-label="${esc(COPY.brand.name)}"><div class="wrap nav-inner">
<a class="brand" href="#hero" aria-label="${esc(COPY.brand.name)}">${mark}<div class="wordmark"><strong>${COPY.brand.golden}</strong><span>${COPY.brand.hass}</span></div></a>
<div class="nav-links">${COPY.nav.map((s,i)=>`<a href="#${['caja','como','precio','preguntas'][i]}">${esc(s)}</a>`).join('')}</div><div class="nav-cta">${wa()}</div></div></nav>
<main>
<header class="hero" id="hero" aria-label="${esc(COPY.hero.title.join(' '))}"><div class="wrap hero-grid"><div class="hero-copy"><p class="kicker">${COPY.hero.kicker}</p><h1>${COPY.hero.title.map(t=>`<span>${esc(t)}</span>`).join(' ')}</h1><p class="lead">${esc(COPY.hero.lead)}</p><div class="price-chip">${COPY.hero.solo}<strong>${COPY.hero.price}</strong></div><div class="hero-actions">${wa()}<a class="text-link" href="#caja">${COPY.hero.more}</a></div></div><div class="product-stage">${[0,1,2].map(()=>`<svg class="leaf" viewBox="0 0 100 100" aria-hidden="true">${leaf}</svg>`).join('')}<img class="box-art" src="${COPY.assets.box}" width="800" height="740" alt="${esc(COPY.hero.alt)}" fetchpriority="high"></div></div></header>
<section class="section" id="caja" aria-label="${COPY.box.kicker}"><div class="wrap">${heading(COPY.box.kicker,COPY.box.title,'caja-title')}<div class="split-panels">${COPY.box.panels.map((p,i)=>`<div class="ripeness-panel">${fruit(i===0)}<div><h3>${p[0]}</h3><p>${p[1]}</p></div></div>`).join('')}</div><div class="week"><p class="week-caption" id="week-caption" aria-live="polite" aria-atomic="true"></p><div class="avocado-row" aria-hidden="true">${Array.from({length:8},(_,i)=>`<div class="fruit ${i<4?'ready':''}">${fruit()}<div class="dark-fruit">${fruit(true)}</div></div>`).join('')}</div><div class="range-wrap"><label class="sr-only" for="day">${COPY.box.label}</label><input id="day" type="range" min="1" max="7" step="1" value="1" aria-describedby="week-caption"><div class="range-labels"><span>${COPY.box.first}</span><output id="day-label" for="day"></output><span>${COPY.box.last}</span></div></div></div></div></section>
<section class="section dark" id="como" aria-label="${COPY.how.kicker}"><div class="wrap">${heading(COPY.how.kicker,COPY.how.title,'como-title')}<div class="steps">${COPY.how.steps.map((s,i)=>`<div class="step"><span class="step-number">${COPY.how.numbers[i]}</span><p>${esc(s)}</p></div>`).join('')}</div></div></section>
<section class="section" id="porque" aria-label="${COPY.why.kicker}"><div class="wrap">${heading(COPY.why.kicker,COPY.why.title,'porque-title')}<div class="benefits">${COPY.why.cards.map((c,i)=>`<article class="benefit reveal" style="--delay:${i*40}ms"><div class="icon-disc">${icons[['avocado','combo','truck','shield','wa'][i]]}</div><h3>${esc(c[0])}</h3><p>${esc(c[1])}</p></article>`).join('')}</div></div></section>
<section class="section dark guarantee" id="garantia" aria-label="${COPY.guarantee.kicker}"><div class="wrap guarantee-inner"><div class="guarantee-icon">${icons.shield}</div><div><p class="kicker">${COPY.guarantee.kicker}</p><h2>${esc(COPY.guarantee.title)}</h2><p>${esc(COPY.guarantee.line)}</p></div></div></section>
<section class="section pricing" id="precio" aria-label="${COPY.price.kicker}"><div class="wrap">${heading(COPY.price.kicker,COPY.price.title,'precio-title')}<div class="price-card"><p class="price-number">${COPY.price.amount}</p><p class="per-box">${COPY.price.unit}</p><ul class="checklist">${COPY.price.items.map(t=>`<li>${icons.check}<span>${esc(t)}</span></li>`).join('')}</ul>${wa()}</div><p class="zone">${COPY.price.zone} ${pending()}</p></div></section>
<section class="section" id="preguntas" aria-label="${COPY.faq.kicker}"><div class="wrap faq-layout">${heading(COPY.faq.kicker,COPY.faq.title,'preguntas-title')}<div class="faq-list">${COPY.faq.items.map(([q,a])=>`<details ${a===null?'open':''}><summary>${esc(q)}</summary><p>${a===null?pending():esc(a)}</p></details>`).join('')}</div></div></section>
<section class="section dark contact" id="contacto" aria-label="${esc(COPY.contact.title)}"><div class="wrap"><div class="contact-inner"><div><h2>${esc(COPY.contact.title)}</h2><div class="contact-actions">${wa()}</div></div><div class="qr-group"><div class="qr-slot">${COPY.assets.qrReady?'':`<strong>${COPY.contact.qr}</strong>`}<img src="${COPY.assets.qr}" width="160" height="160" alt="${COPY.assets.qrReady?COPY.contact.qr:''}"></div>${COPY.assets.qrReady?'':pending()}<p>${esc(COPY.contact.line)}</p></div></div><p class="contact-meta">${COPY.contact.city} ${pending()}</p></div></section>
</main><footer class="footer"><div class="wrap footer-inner"><div class="badges">${COPY.footer.badges.map((s,i)=>`<span class="badge">${icons[['leaf','heart','leaf','person'][i]]}${esc(s)}</span>`).join('')}</div><div class="footer-social">${COPY.footer.instagram} ${pending()}<br>${COPY.footer.copyright}</div></div></footer>`;

const range = document.getElementById('day');
function updateDay(){
  const day=Number(range.value), ready=Math.min(8,day+3);
  const caption=COPY.box.caption.replace('{n}',ready), label=COPY.box.day.replace('{n}',day);
  document.getElementById('week-caption').textContent=caption;
  document.getElementById('day-label').textContent=label;
  range.setAttribute('aria-valuetext',`${label}. ${caption}`);
  document.querySelectorAll('.fruit').forEach((el,i)=>el.classList.toggle('ready',i<ready));
}
range.addEventListener('input',updateDay);updateDay();

// A single scheduler owns every animated transform. Input events only store state.
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const stage=document.querySelector('.product-stage'),box=document.querySelector('.box-art');
const leaves=[...document.querySelectorAll('.leaf')];
let pointer={x:0,y:0},position={x:0,y:0},stageBounds=null,frame=0,active=false;
const subscribers=new Set();
function schedule(){if(!frame&&!reduced.matches&&!document.hidden)frame=requestAnimationFrame(tick)}
function tick(t){frame=0;if(reduced.matches||document.hidden)return;subscribers.forEach(fn=>fn(t));if(active)schedule()}
function measure(){stageBounds=stage.getBoundingClientRect()}
subscribers.add(t=>{
  if(!active)return;
  if(!stageBounds)measure();
  position.x+=(pointer.x-position.x)*.08;position.y+=(pointer.y-position.y)*.08;
  box.style.transform=`translate(${position.x.toFixed(3)}px,${position.y.toFixed(3)}px)`;
  leaves.forEach((leaf,i)=>leaf.style.transform=`translate(${(Math.sin(t/4100+i*2)*6).toFixed(2)}px,${(Math.cos(t/5200+i)*9).toFixed(2)}px)`);
});
stage.addEventListener('pointermove',e=>{if(reduced.matches||e.pointerType==='touch'||!stageBounds)return;pointer.x=Math.max(-6,Math.min(6,((e.clientX-stageBounds.left)/stageBounds.width-.5)*12));pointer.y=Math.max(-6,Math.min(6,((e.clientY-stageBounds.top)/stageBounds.height-.5)*12));schedule()});
stage.addEventListener('pointerleave',()=>{pointer={x:0,y:0};schedule()});
window.addEventListener('resize',()=>{stageBounds=null;schedule()},{passive:true});
window.addEventListener('scroll',()=>{stageBounds=null;schedule()},{passive:true});
const stageObserver=new IntersectionObserver(([entry])=>{active=entry.isIntersecting;stageBounds=null;if(active)schedule()});stageObserver.observe(stage);
const revealObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.remove('is-hidden');revealObserver.unobserve(entry.target)}}),{threshold:.12});
document.querySelectorAll('.reveal').forEach(el=>{if(!reduced.matches){el.classList.add('is-hidden');revealObserver.observe(el)}});
function resetMotion(){if(reduced.matches){cancelAnimationFrame(frame);frame=0;box.style.transform='none';leaves.forEach(el=>el.style.transform='none');document.querySelectorAll('.reveal').forEach(el=>el.classList.remove('is-hidden'))}else schedule()}
reduced.addEventListener('change',resetMotion);document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(frame);frame=0}else schedule()});resetMotion();
</script>
</body></html>
